name: Android checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check Unix Gradle wrapper
        run: test -s gradlew && test -x gradlew && ./gradlew --version
      - name: Create build-only Firebase configuration
        run: python3 scripts/create_ci_firebase_config.py
      - name: Build, lint, and unit tests
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --no-configuration-cache
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run database migration and lifecycle UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest --no-configuration-cache
